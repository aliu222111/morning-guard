name: MorningGuard

schemes:
  MorningGuard:
    build:
      targets:
        MorningGuard: all
        "MorningGuardExtension MorningGuardExtension MorningGuardExtension": all
        MorningGuardShield: all
        MorningGuardWidgets: all
        MorningGuardTests: [test]
        MorningGuardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MorningGuardTests
        - MorningGuardUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

options:
  bundleIdPrefix: com.alex
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.6"
  minimumXcodeGenVersion: "2.40"

# Project-level build settings (mirrors the global XCBuildConfiguration in .pbxproj)
settings:
  base:
    # App version + build, shared by every target. Change these in one place,
    # then run `xcodegen generate`. Version = public App Store version (1.0, 1.1…);
    # Build = a unique, always-increasing number for each App Store Connect upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MTL_FAST_MATH: YES
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      ASSETCATALOG_COMPILER_OPTIMIZATION: space

targets:

  # ── Main application ──────────────────────────────────────────────────────
  MorningGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: MorningGuard
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: MorningGuard/MorningGuard.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 42N6589XL7
        ENABLE_APP_SANDBOX: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UILaunchScreen_BackgroundColorName[sdk=iphoneos*]": MorningCream
        "INFOPLIST_KEY_UILaunchScreen_BackgroundColorName[sdk=iphonesimulator*]": MorningCream
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphoneos*]": UIStatusBarStyleDefault
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphonesimulator*]": UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.MorningGuard
        PRODUCT_NAME: "$(TARGET_NAME)"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "Morning Guard uses the camera to measure ambient light levels for your morning sunlight routine."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Morning Guard uses the microphone to let you dictate your journal entries by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Morning Guard uses speech recognition to transcribe your voice into journal text."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Morning Guard uses your location to show your local weather."
        INFOPLIST_KEY_NSMotionUsageDescription: "Morning Guard uses motion data to detect which way your phone is facing so the correct camera can measure light levels."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        REGISTER_APP_GROUPS: YES
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      # Extensions embedded in the app bundle
      - target: "MorningGuardExtension MorningGuardExtension MorningGuardExtension"
        embed: true
      - target: MorningGuardShield
        embed: true
      - target: MorningGuardWidgets
        embed: true
      # Screen Time frameworks
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  # ── DeviceActivityMonitor extension ───────────────────────────────────────
  "MorningGuardExtension MorningGuardExtension MorningGuardExtension":
    type: app-extension
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: "MorningGuardExtension MorningGuardExtension MorningGuardExtension"
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: MorningGuard/PrivacyInfo.xcprivacy
      - path: MorningGuard/StreakLedger.swift
    settings:
      base:
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_ENTITLEMENTS: "MorningGuardExtension MorningGuardExtension MorningGuardExtension/MorningGuardExtension_MorningGuardExtension_MorningGuardExtension.entitlements"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 42N6589XL7
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: "MorningGuardExtension MorningGuardExtension MorningGuardExtension/Info.plist"
        INFOPLIST_KEY_CFBundleDisplayName: "Morning Guard Monitor"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: "com.alex.MorningGuard.MorningGuardExtension-MorningGuardExtension-MorningGuardExtension"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: iphoneos
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: "MorningGuardExtension MorningGuardExtension MorningGuardExtension/MorningGuardExtension MorningGuardExtension MorningGuardExtension-Bridging-Header.h"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework

  # ── ShieldConfiguration extension ─────────────────────────────────────────
  MorningGuardShield:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: MorningGuardShield
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: MorningGuard/PrivacyInfo.xcprivacy
    settings:
      base:
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_ENTITLEMENTS: MorningGuardShield/MorningGuardShield.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 42N6589XL7
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MorningGuardShield/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MorningGuardShield
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.MorningGuard.MorningGuardShield
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: iphoneos
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  # ── WidgetKit extension ───────────────────────────────────────────────────
  MorningGuardWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: MorningGuardWidgets
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: MorningGuard/PrivacyInfo.xcprivacy
      - path: MorningGuard/StreakLedger.swift
    settings:
      base:
        CLANG_ENABLE_MODULES: YES
        CODE_SIGN_ENTITLEMENTS: MorningGuardWidgets/MorningGuardWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 42N6589XL7
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MorningGuardWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Morning Guard Widgets"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.MorningGuard.MorningGuardWidgets
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: iphoneos
        SKIP_INSTALL: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # ── Unit tests ────────────────────────────────────────────────────────────
  MorningGuardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: MorningGuardTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 42N6589XL7
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.MorningGuardTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MorningGuard.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MorningGuard"
    dependencies:
      - target: MorningGuard

  # ── UI tests ──────────────────────────────────────────────────────────────
  MorningGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: MorningGuardUITests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 42N6589XL7
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.6"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.MorningGuardUITests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: auto
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: MorningGuard
    dependencies:
      - target: MorningGuard
